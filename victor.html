<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor — Victory Martial Arts AI Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  .chat-wrapper {
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 680px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
  }

  .chat-header {
    background: #1A1A2E;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #E02020;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: white;
    flex-shrink: 0;
  }

  .header-info h2 {
    color: white;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }

  .header-info p {
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    margin: 2px 0 0;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #22c55e;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f4f4f6;
  }

  .message {
    display: flex;
    gap: 8px;
    max-width: 85%;
  }

  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .message.assistant {
    align-self: flex-start;
  }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #E02020;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: white;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg-avatar.user-av {
    background: #1A1A2E;
    font-size: 9px;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
  }

  .message.assistant .bubble {
    background: #ffffff;
    color: #1a1a2e;
    border: 1px solid #e8e8f0;
    border-bottom-left-radius: 4px;
  }

  .message.user .bubble {
    background: #E02020;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: #ffffff;
    border: 1px solid #e8e8f0;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
    align-items: center;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: #E02020;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
    display: block;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 16px 0;
    background: #f4f4f6;
    flex-shrink: 0;
  }

  .quick-btn {
    background: #ffffff;
    border: 1px solid #d0d0e0;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    color: #4a4a5a;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .quick-btn:hover {
    border-color: #E02020;
    color: #E02020;
    background: #fff5f5;
  }

  .input-area {
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    background: #ffffff;
    border-top: 1px solid #e8e8f0;
    flex-shrink: 0;
    align-items: flex-end;
  }

  .input-area textarea {
    flex: 1;
    border: 1px solid #d0d0e0;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #1a1a2e;
    background: #f4f4f6;
    resize: none;
    outline: none;
    line-height: 1.4;
    min-height: 38px;
    max-height: 100px;
    overflow-y: auto;
    transition: border-color 0.15s;
  }

  .input-area textarea:focus { border-color: #E02020; }

  .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #E02020;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
  }

  .send-btn:hover { opacity: 0.88; transform: scale(1.04); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .powered {
    text-align: center;
    font-size: 10px;
    color: #aaa;
    padding: 7px;
    background: #ffffff;
    border-top: 1px solid #f0f0f0;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }

  .powered a { color: #E02020; text-decoration: none; }

  @media (max-width: 520px) {
    body { padding: 0; align-items: flex-start; }
    .chat-wrapper { height: 100vh; max-width: 100%; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="avatar">V</div>
    <div class="header-info">
      <h2>Victor</h2>
      <p><span class="status-dot"></span>Victory Martial Arts AI Assistant</p>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-replies" id="quickReplies">
    <button class="quick-btn" onclick="sendQuick('What classes do you offer?')">Classes offered</button>
    <button class="quick-btn" onclick="sendQuick('What events are coming up?')">Upcoming events</button>
    <button class="quick-btn" onclick="sendQuick('How do I start a trial?')">Start a trial</button>
    <button class="quick-btn" onclick="sendQuick('Tell me about belt promotions')">Belt promotions</button>
    <button class="quick-btn" onclick="sendQuick('Do you have summer camps?')">Summer camps</button>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="Ask Victor anything about Victory Martial Arts..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>

  <div class="powered">Powered by <a href="https://aidataflow.io" target="_blank">AI Data Flow</a> &middot; aidataflow.io</div>
</div>

<script>
const SYSTEM_PROMPT = `You are Victor, the friendly and knowledgeable AI assistant for Victory Martial Arts. You help parents, students, and prospective members with questions about classes, programs, schedules, trials, events, camps, and anything related to Victory Martial Arts.

Be warm, encouraging, and concise. Always promote the incredible community and 30+ years of legacy at Victory Martial Arts. When relevant, encourage people to sign up for a trial or upcoming event.

PROGRAMS OFFERED:
- Jiu Jitsu: avg 6 months membership
- Tigers Victory Program (kids): avg 17 months — very popular with families
- Victory Program: avg 17 months — most popular program with 112 active members
- Tigers Leadership Program (kids): avg 25 months — great for developing young leaders
- Leadership Program: avg 24 months — builds discipline and leadership skills
- Legacy Program: avg 22 months — our most rewarding long-term journey
- Warrior Program: avg 21 months

TRIALS AVAILABLE:
- Limited Time Offer: just $49 (most popular)
- 33 Days Trial: great way to experience the full program
- 4 Week Trial: $99
- 4 Week Family Trial: perfect for the whole family
- 2 Week Trial: available now
- 1 Week FREE Trial: no commitment, just come try it

CLASS SCHEDULE:
- Adult Class: 12:00 PM - 1:00 PM
- Black Belts: 7:15 PM - 8:00 PM
- Demo Team 1: 6:30 PM - 7:30 PM
- Demo Team 2: 5:45 PM - 6:30 PM
- Eagle (ages 3-6): 10:15-10:45 AM, 4:00-4:30 PM, 4:15-4:45 PM, 6:00-6:30 PM
- Eagle Advance: 10:45 AM - 11:45 AM
- Eagle Leadership: 3:45 PM - 4:15 PM
- Family Class: 11:45 AM-12:30 PM, 4:45-5:30 PM, 7:15-8:00 PM, 7:30-8:15 PM
- Jiu Jitsu: 8:00-9:00 AM, 8:00-9:30 PM, 8:15-9:45 PM
- Krav Maga: 9:00-9:45 AM, 8:00-9:00 PM
- Leadership: 5:15-5:45 PM, 5:30-6:00 PM
- Legacy: 6:30-7:15 PM
- Sparring Class: 11:15-11:45 AM, 4:30-5:15 PM
- Victory Class (White to Yellow Belt): 4:30-5:15 PM, 6:30-7:15 PM
- Victory Prep (Camo belts and up): 5:45-6:30 PM
- XMA Advance: 5:15-5:45 PM
- XMA Beginner: 4:00-4:30 PM

UPCOMING EVENTS & CAMPS:
- Ninja Party: Friday May 22 — fun event, open now
- Pre Camp: June 22-26 — spots available, register now
- XMA Camp 1: June 1-5 — limited spots remaining
- XMA Camp 2: July 13-17 — spots available
- July BootCamp 2026: coming in July
- Safety Camp: August 3-7 — spots available
- Victory World Convention Tournament: upcoming — 20 participants registered
- Summer Camp Special: popular event — register now

RECURRING EVENTS:
- Belt Promotions: our biggest celebration with 1,235+ total participants — a major milestone for students advancing in rank
- Victory Tournament: competitive event, great for students ready to compete
- Victory Camps: ongoing enrichment programs
- Victory Birthday Parties: a unique and memorable birthday experience at the dojo — limited bookings available
- Black Belt Testing: prestigious milestone event
- FREE Introductory Class: no commitment, just come experience Victory

IMPORTANT NOTES:
- Victory Martial Arts has 30+ years of history and community
- Programs for all ages starting from 3 years old (Eagle program)
- Family-friendly with Family Class, Family Trial, and Birthday Party options
- Multiple paths: recreational, leadership, competitive (Demo Team, XMA, Tournaments)
- Clear belt progression system with celebrated promotions
- Krav Maga and Jiu Jitsu available for adults seeking self-defense skills

Always be helpful, warm, and encouraging. Never make up information not listed above. If asked about specific pricing not listed or enrollment links, tell them the team will be happy to help and suggest they visit or call the school. Keep responses concise — 3 to 5 sentences max unless a list is needed. End with an encouraging note or a gentle call to action when appropriate.`;

let messages = [];
let isLoading = false;

function addMessage(role, content) {
  messages.push({ role, content });
  renderMessages();
}

function renderMessages() {
  const container = document.getElementById('messages');
  container.innerHTML = '';

  if (messages.length === 0) {
    const welcome = document.createElement('div');
    welcome.className = 'message assistant';
    welcome.innerHTML = '<div class="msg-avatar">V</div><div class="bubble">Hi! I\'m Victor, your Victory Martial Arts assistant. I can help with class schedules, programs, upcoming camps, belt promotions, trials, and more. What would you like to know?</div>';
    container.appendChild(welcome);
  }

  messages.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'message ' + msg.role;
    if (msg.role === 'assistant') {
      div.innerHTML = '<div class="msg-avatar">V</div><div class="bubble">' + msg.content.replace(/\n/g,'<br>') + '</div>';
    } else {
      div.innerHTML = '<div class="bubble">' + msg.content + '</div><div class="msg-avatar user-av">You</div>';
    }
    container.appendChild(div);
  });

  if (isLoading) {
    const t = document.createElement('div');
    t.className = 'message assistant';
    t.innerHTML = '<div class="msg-avatar">V</div><div class="typing"><span></span><span></span><span></span></div>';
    container.appendChild(t);
  }

  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  autoResize(input);
  document.getElementById('quickReplies').style.display = 'none';

  addMessage('user', text);
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  renderMessages();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });
    const data = await response.json();
    const reply = data.content?.[0]?.text || 'Sorry, I had trouble with that. Please try again!';
    addMessage('assistant', reply);
  } catch (err) {
    addMessage('assistant', 'Sorry, I ran into a connection issue. Please try again in a moment!');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  renderMessages();
}

function sendQuick(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

renderMessages();
</script>
</body>
</html>
